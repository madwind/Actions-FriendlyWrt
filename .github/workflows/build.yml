name: Build FriendlyWrt

on:
  watch:
    types: started

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Get release tag
      id: release_tag
      run: |
        release_tag="FriendlyWrt-$(date +%Y-%m-%d)"
        echo "release_tag=$release_tag" >> $GITHUB_OUTPUT

    - name: Create empty release
      id: release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.release_tag.outputs.release_tag }}
        draft: false
        prerelease: false
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
      upload_url: ${{ steps.release.outputs.upload_url }}

  build_friendlywrt:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      matrix:
        VERSION: ['25.12']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        wget https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh
        sed -i -e 's/^apt-get -y install openjdk-8-jdk/# apt-get -y install openjdk-8-jdk/g' install.sh
        sed -i -e 's/^\[ -d fa-toolchain \]/# [ -d fa-toolchain ]/g' install.sh
        sed -i -e 's/^(cat fa-toolchain/# (cat fa-toolchain/g' install.sh
        sed -i -e 's/^(tar xf fa-toolchain/# (tar xf fa-toolchain/g' install.sh
        sudo -E bash ./install.sh
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3528.xml --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle

        repo sync -c friendlywrt --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse --no-clone-bundle
        repo sync -c toolchain --no-clone-bundle

    - name: Apply customizations
      run: |
        cd project
        source ../scripts/custome_config.sh
        grep -qxF 'CONFIG_CCACHE=y' configs/rockchip/01-nanopi || echo 'CONFIG_CCACHE=y' >> configs/rockchip/01-nanopi

    - name: Prepare dot config and feeds
      run: |
        cd project
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }} | awk -F . '{print $1}')
        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3528/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=rockchip
        EOL
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Restore source download cache
      uses: actions/cache@v4
      with:
        path: project/friendlywrt/dl
        key: friendlywrt-dl-${{ matrix.VERSION }}-${{ github.run_id }}
        restore-keys: |
          friendlywrt-dl-${{ matrix.VERSION }}-

    - name: Restore compiler cache
      uses: actions/cache@v4
      with:
        path: project/friendlywrt/.ccache
        key: friendlywrt-ccache-${{ matrix.VERSION }}-${{ github.run_id }}
        restore-keys: |
          friendlywrt-ccache-${{ matrix.VERSION }}-

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile friendlyWrt
      id: compile
      continue-on-error: true
      run: |
        cd project/friendlywrt
        if ! make -j$(nproc); then
          echo "::warning::parallel build failed, retrying with V=s"
          make -j1 V=s
        fi

    - name: Check the result and try again
      if: steps.compile.outcome == 'failure'
      run: |
        cd project/friendlywrt
        make -j1 V=s

    - name: Show compiler cache statistics
      run: |
        cd project/friendlywrt
        if [ -x staging_dir/host/bin/ccache ]; then
          CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache -M 2G
          CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache -c
          CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache -s
        fi

    - name: Create rootfs package
      id: create_rootfs_package
      run: |
        cd project
        source .current_config.mk
        rootfs_filename="rootfs-friendlywrt-${{ matrix.VERSION }}.tgz"
        tar czf ../artifact/${rootfs_filename} ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_ROOTFS} \
              ${FRIENDLYWRT_SRC}/${FRIENDLYWRT_PACKAGE_DIR}
        echo "rootfs_filename=$rootfs_filename" >> $GITHUB_OUTPUT

    - name: Create host package-manager bundle
      id: create_host_pm_package
      run: |
        cd project
        source .current_config.mk
        PM_BIN=
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk ] && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/apk
        [ -f ${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg ] && PM_BIN=${FRIENDLYWRT_SRC}/staging_dir/host/bin/opkg
        if [ -z "$PM_BIN" ]; then
          echo "ERROR: neither apk nor opkg found under ${FRIENDLYWRT_SRC}/staging_dir/host/bin/"
          exit 1
        fi
        echo "Detected host package manager: $PM_BIN"

        ldd_out=$(ldd "$PM_BIN" 2>&1 || true)
        echo "$ldd_out"
        if ! echo "$ldd_out" | grep -q "not a dynamic executable"; then
          bad_paths=$(echo "$ldd_out" | grep -oE '=> /[^ ]+' | sed 's|=> ||' \
                       | grep -vE '^/(lib|lib64|usr/lib)/' || true)
          not_found=$(echo "$ldd_out" | grep -F "not found" || true)
          if [ -n "$bad_paths" ] || [ -n "$not_found" ]; then
            echo "ERROR: $PM_BIN has non-portable dynamic dependencies:"
            [ -n "$bad_paths" ] && { echo "non-system paths:"; echo "$bad_paths"; }
            [ -n "$not_found" ] && { echo "unresolved:"; echo "$not_found"; }
            exit 1
          fi
        fi

        host_pm_filename="host-pm-${{ matrix.VERSION }}.tgz"
        tar czf ../artifact/${host_pm_filename} "$PM_BIN"
        echo "host_pm_filename=$host_pm_filename" >> $GITHUB_OUTPUT

    - name: Upload rootfs package
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        asset_name: ${{ steps.create_rootfs_package.outputs.rootfs_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

    - name: Upload host package-manager bundle
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        asset_name: ${{ steps.create_host_pm_package.outputs.host_pm_filename }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  build_img:
    needs: [prepare_release,build_friendlywrt]
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      matrix:
        VERSION: ['25.12']

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d
        wget https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh
        sed -i -e 's/^apt-get -y install openjdk-8-jdk/# apt-get -y install openjdk-8-jdk/g' install.sh
        sed -i -e 's/^\[ -d fa-toolchain \]/# [ -d fa-toolchain ]/g' install.sh
        sed -i -e 's/^(cat fa-toolchain/# (cat fa-toolchain/g' install.sh
        sed -i -e 's/^(tar xf fa-toolchain/# (tar xf fa-toolchain/g' install.sh
        sudo -E bash ./install.sh
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'noreply@github.com'
        git config --global color.ui false
        git clone https://github.com/friendlyarm/repo
        sudo -E cp repo/repo /usr/bin/
        mkdir -p ./artifact
        sudo swapoff -a || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc 2>/dev/null || true
        echo "cores: $(nproc)"

    - name: Download source
      run: |
        mkdir project
        cd project
        repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ matrix.VERSION }} \
                -m rk3528.xml --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle

        repo sync -c kernel --no-clone-bundle
        repo sync -c u-boot --no-clone-bundle
        repo sync -c rkbin --no-clone-bundle
        repo sync -c configs --no-clone-bundle
        repo sync -c device/common --no-clone-bundle
        repo sync -c device/friendlyelec --no-clone-bundle
        repo sync -c scripts --no-clone-bundle
        repo sync -c scripts/sd-fuse --no-clone-bundle

    - name: Resolve image build cache keys
      id: image_cache_key
      run: |
        set -euo pipefail
        cd project

        uboot_key=$(
          {
            git -C u-boot rev-parse HEAD
            git -C rkbin rev-parse HEAD
            git -C scripts rev-parse HEAD
            git -C scripts/sd-fuse rev-parse HEAD
            git -C device/friendlyelec rev-parse HEAD
            printf '%s\n' 'TARGET_UBOOT_CONFIG=nanopi_zero2_defconfig'
          } | sha256sum | awk '{print $1}'
        )

        external_driver_refs=$(
          while read -r url branch; do
            sha=$(git ls-remote "$url" "refs/heads/$branch" | awk 'NR == 1 {print $1}')
            if [ -z "$sha" ]; then
              echo "Unable to resolve $url $branch" >&2
              exit 1
            fi
            printf '%s %s %s\n' "$url" "$branch" "$sha"
          done <<'EOF'
        https://github.com/friendlyarm/r8125 main
        https://github.com/cryptodev-linux/cryptodev-linux.git master
        https://github.com/friendlyarm/aic8800 main
        https://github.com/friendlyarm/nft-fullcone master
        https://github.com/lwfinger/rtw88 master
        https://github.com/friendlyarm/rtl8821CU nanopi-r2
        https://github.com/friendlyarm/rtl8822bu nanopi-r2
        https://github.com/friendlyarm/rtl8822cs nanopi-r2
        https://github.com/friendlyarm/rtl8822ce nanopi-r2
        https://github.com/friendlyarm/rtl8812au nanopi-r2
        https://github.com/friendlyarm/rtl8851bu nanopi-r2
        EOF
        )

        kernel_key=$(
          {
            git -C kernel rev-parse HEAD
            git -C scripts rev-parse HEAD
            git -C scripts/sd-fuse rev-parse HEAD
            git -C device/friendlyelec rev-parse HEAD
            sha256sum ../scripts/custome_kernel_config.sh | awk '{print $1}'
            printf '%s\n' 'TARGET_KERNEL_CONFIG=nanopi5_linux_defconfig friendlywrt.config kvm.config'
            printf '%s\n' "$external_driver_refs"
          } | sha256sum | awk '{print $1}'
        )

        echo "uboot_key=$uboot_key" >> "$GITHUB_OUTPUT"
        echo "kernel_key=$kernel_key" >> "$GITHUB_OUTPUT"

    - name: Prepare image build cache directories
      run: |
        mkdir -p project/.build-cache/uboot project/.build-cache/kernel

    - name: Restore U-Boot build products
      id: uboot_cache
      uses: actions/cache@v4
      with:
        path: project/.build-cache/uboot
        key: r28s-uboot-v1-${{ matrix.VERSION }}-${{ steps.image_cache_key.outputs.uboot_key }}

    - name: Restore kernel build products
      id: kernel_cache
      uses: actions/cache@v4
      with:
        path: project/.build-cache/kernel
        key: r28s-kernel-v1-${{ matrix.VERSION }}-${{ steps.image_cache_key.outputs.kernel_key }}

    - name: Download friendlywrt rootfs
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "rootfs-friendlywrt-${{ matrix.VERSION }}.tgz"

    - name: Download host package-manager bundle
      uses: robinraju/release-downloader@v1.6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        repository: ${{ github.repository }}
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        fileName: "host-pm-${{ matrix.VERSION }}.tgz"

    - name: Prepare config
      id: config
      run: |
        cd project
        MODEL=R28S-Zero2-NEO3Plus-Series
        IMG_FILE=${MODEL}-FriendlyWrt-${{ matrix.VERSION }}.img
        DIST_DIR=friendlywrt$(echo ${{ matrix.VERSION }} | awk -F . '{print $1}')

        cat > .current_config.mk <<EOL
        . device/friendlyelec/rk3528/base.mk
        TARGET_IMAGE_DIRNAME=${DIST_DIR}
        TARGET_FRIENDLYWRT_CONFIG=rockchip
        TARGET_SD_RAW_FILENAME=${IMG_FILE}
        EOL

        echo "img_filename=$IMG_FILE" >> $GITHUB_OUTPUT

    - name: Unpack friendlywrt rootfs
      run: |
        cd project
        tar xzf "../rootfs-friendlywrt-${{ matrix.VERSION }}.tgz"

    - name: Unpack host package-manager bundle
      run: |
        cd project
        tar xzf "../host-pm-${{ matrix.VERSION }}.tgz"

    - name: Exclude local APK repository from firmware
      run: |
        cd project
        python3 - <<'PY'
        from pathlib import Path

        path = Path('build.sh')
        text = path.read_text()
        marker = '\t\t[ -d ${ROOTFS_DIR}/opt ] || mkdir ${ROOTFS_DIR}/opt\n'
        cleanup = (
            '\t\t# Keep the package repository only as a build-time input.\n'
            '\t\trm -rf "${ROOTFS_DIR}/usr/local/$(basename "${FRIENDLYWRT_PACKAGE_DIR}")"\n'
            '\t\trm -f "${ROOTFS_DIR}/etc/apk/repositories.d/local.list"\n\n'
        )
        if text.count(marker) != 1:
            raise SystemExit('unable to locate rootfs image preparation point in build.sh')
        path.write_text(text.replace(marker, cleanup + marker, 1))
        PY

    - name: Compile U-Boot
      if: steps.uboot_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        cd project
        ./build.sh uboot

        rm -rf .build-cache/uboot
        mkdir -p .build-cache/uboot
        cp u-boot/uboot.img .build-cache/uboot/
        loader=$(find u-boot -maxdepth 1 -type f \( -name 'rk3528_spl_loader_*.bin' -o -name 'rk3528_loader_*.bin' \) | sort -V | tail -1)
        [ -n "$loader" ] || { echo "R28S U-Boot loader was not generated" >&2; exit 1; }
        cp "$loader" .build-cache/uboot/

    - name: Compile kernel
      if: steps.kernel_cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        cd project
        ## If you need to modify the kernel configuration, please edit the script below
        # source ../scripts/custome_kernel_config.sh

        ./build.sh kernel

        rm -rf .build-cache/kernel
        mkdir -p .build-cache/kernel
        test -f kernel/kernel.img
        test -f kernel/resource.img
        test -d scripts/sd-fuse/out/output_rk3528_kmodules
        cp kernel/kernel.img kernel/resource.img .build-cache/kernel/
        cp -a scripts/sd-fuse/out/output_rk3528_kmodules .build-cache/kernel/

    - name: Install cached image build products
      run: |
        set -euo pipefail
        cd project

        test -f .build-cache/uboot/uboot.img
        loader=$(find .build-cache/uboot -maxdepth 1 -type f \( -name 'rk3528_spl_loader_*.bin' -o -name 'rk3528_loader_*.bin' \) | sort -V | tail -1)
        [ -n "$loader" ] || { echo "Cached R28S U-Boot loader is missing" >&2; exit 1; }
        cp .build-cache/uboot/uboot.img u-boot/
        cp "$loader" u-boot/

        test -f .build-cache/kernel/kernel.img
        test -f .build-cache/kernel/resource.img
        test -d .build-cache/kernel/output_rk3528_kmodules
        cp .build-cache/kernel/kernel.img .build-cache/kernel/resource.img kernel/
        rm -rf scripts/sd-fuse/out/output_rk3528_kmodules
        cp -a .build-cache/kernel/output_rk3528_kmodules scripts/sd-fuse/out/

    - name: Build sd image
      run: |
        cd project
        ./build.sh sd-img
        mv out/${{ steps.config.outputs.img_filename }} ../artifact/
        cd ../artifact/
        gzip *.img

    - name: Upload XYZ.img.gz to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ steps.config.outputs.img_filename }}.gz
        asset_name: ${{ steps.config.outputs.img_filename }}.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true

  cleanup_intermediate_assets:
    needs: [prepare_release, build_img]
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Delete intermediate assets from release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare_release.outputs.release_tag }}
      run: |
        gh release view "$RELEASE_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --json assets \
          --jq '.assets[] | select(.name | startswith("rootfs-friendlywrt-") or startswith("host-pm-")) | .name' \
        | while read -r asset; do
            [ -z "$asset" ] && continue
            echo "Deleting asset: $asset"
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes --repo "$GITHUB_REPOSITORY"
          done