name: Build FriendlyWrt

on:
  watch:
    types: started
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: '25.12'
  MODEL: R28S-Zero2-NEO3Plus-Series

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Get release tag
      id: release_tag
      run: |
        release_tag="FriendlyWrt-$(date +%Y-%m-%d)"
        echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

    - name: Create empty release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.release_tag.outputs.release_tag }}
        draft: false
        prerelease: false
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}

  build_friendlywrt:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: bash custom/r28s/host.sh setup

    - name: Download source
      run: bash custom/r28s/host.sh sync friendlywrt

    - name: Apply R28S configuration
      run: |
        cd project
        source ../custom/r28s/config.sh
        bash ../custom/r28s/artifacts.sh write-config
        DEBUG_DOT_CONFIG=1 ./build.sh friendlywrt

    - name: Restore FriendlyWrt download cache
      uses: actions/cache/restore@v4
      with:
        path: project/friendlywrt/dl
        key: friendlywrt-dl-${{ runner.os }}-${{ env.VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          friendlywrt-dl-${{ runner.os }}-${{ env.VERSION }}-

    - name: Restore FriendlyWrt ccache
      uses: actions/cache/restore@v4
      with:
        path: project/friendlywrt/.ccache
        key: friendlywrt-ccache-${{ runner.os }}-${{ env.VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          friendlywrt-ccache-${{ runner.os }}-${{ env.VERSION }}-

    - name: Download package
      run: |
        cd project/friendlywrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile FriendlyWrt
      id: compile
      continue-on-error: true
      run: |
        cd project/friendlywrt
        if ! make -j$(nproc); then
          echo "::warning::parallel build failed, retrying with V=s"
          make -j1 V=s
        fi

    - name: Check the result and try again
      if: steps.compile.outcome == 'failure'
      run: |
        cd project/friendlywrt
        make -j1 V=s

    - name: Show ccache statistics
      if: always()
      run: |
        cd project/friendlywrt
        make -s ccache-stats || true

    - name: Save FriendlyWrt download cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: project/friendlywrt/dl
        key: friendlywrt-dl-${{ runner.os }}-${{ env.VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Save FriendlyWrt ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: project/friendlywrt/.ccache
        key: friendlywrt-ccache-${{ runner.os }}-${{ env.VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Package FriendlyWrt products
      run: bash custom/r28s/artifacts.sh package-friendlywrt

    - name: Upload FriendlyWrt build products
      uses: actions/upload-artifact@v4
      with:
        name: friendlywrt-${{ env.VERSION }}
        path: |
          artifact/rootfs-friendlywrt-${{ env.VERSION }}.tgz
          artifact/host-pm-${{ env.VERSION }}.tgz
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  build_uboot:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: bash custom/r28s/host.sh setup

    - name: Download source
      run: bash custom/r28s/host.sh sync uboot

    - name: Prepare config
      run: bash custom/r28s/artifacts.sh write-config

    - name: Compile U-Boot
      run: |
        cd project
        ./build.sh uboot

    - name: Package U-Boot products
      run: bash custom/r28s/artifacts.sh package-uboot

    - name: Upload U-Boot build products
      uses: actions/upload-artifact@v4
      with:
        name: uboot-${{ env.VERSION }}
        path: artifact/uboot/
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  build_kernel:
    needs: prepare_release
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: bash custom/r28s/host.sh setup

    - name: Download source
      run: bash custom/r28s/host.sh sync kernel

    - name: Apply R28S kernel customizations
      run: |
        bash custom/r28s/artifacts.sh write-config
        bash custom/r28s/apply-patches.sh kernel
        cd project
        source ../custom/r28s/kernel-config.sh

    - name: Compile kernel
      run: |
        cd project
        BUILD_THIRD_PARTY_DRIVER=0 ./build.sh kernel

    - name: Package kernel products
      run: bash custom/r28s/artifacts.sh package-kernel

    - name: Upload kernel build products
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ env.VERSION }}
        path: artifact/kernel/
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  build_img:
    needs: [prepare_release, build_friendlywrt, build_uboot, build_kernel]
    runs-on: ubuntu-22.04
    if: github.event_name == 'workflow_dispatch' || github.event.repository.owner.id == github.event.sender.id
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      run: bash custom/r28s/host.sh setup

    - name: Download source
      run: bash custom/r28s/host.sh sync image

    - name: Download FriendlyWrt build products
      uses: actions/download-artifact@v4
      with:
        name: friendlywrt-${{ env.VERSION }}
        path: downloads/friendlywrt

    - name: Download U-Boot build products
      uses: actions/download-artifact@v4
      with:
        name: uboot-${{ env.VERSION }}
        path: downloads/uboot

    - name: Download kernel build products
      uses: actions/download-artifact@v4
      with:
        name: kernel-${{ env.VERSION }}
        path: downloads/kernel

    - name: Prepare image build
      run: |
        bash custom/r28s/apply-patches.sh image
        bash custom/r28s/artifacts.sh write-config
        bash custom/r28s/artifacts.sh install-products

    - name: Build SD image
      run: |
        cd project
        SDFUSE_NONINTERACTIVE=1 ./build.sh sd-img
        cd ..
        bash custom/r28s/artifacts.sh collect-image

    - name: Upload image to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ./artifact/${{ env.MODEL }}-FriendlyWrt-${{ env.VERSION }}.img.gz
        asset_name: ${{ env.MODEL }}-FriendlyWrt-${{ env.VERSION }}.img.gz
        tag: ${{ needs.prepare_release.outputs.release_tag }}
        overwrite: true
